repo_url: https://github.com/UnB-IHC/IHC_2026.2_Grupo09
repo_name: Pocket Guide de Acessibilidade

site_url: https://unb-ihc.github.io/IHC_2026.2_Grupo09/
site_name: Pocket guide de acessibilidade

use_directory_urls: false

nav:
  - Início: index.md
  - Desenvolvimento Web:
      - Desenvolvimento: devWeb/non_text_content.md
  - Design:
      - Design: design/design.md
  - Geração de Conteúdo:
      - Conteúdo: geracaoConteudo/conteudo.md
  - Gestão de Projetos:
      - Gestão de Projetos: gestaoProjeto/gestaoProjeto.md
  - Ferramentas:
      - Ferramentas de Acessibilidade: tools/ferramentas.md

theme:
  name: material
  language: pt
  palette:
    scheme: identidade
  font: false
  logo: assets/img/logo.svg
  favicon: assets/img/favicon.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: false
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/css/extra.css

extra:
  generator: false

copyright: "&copy; Grupo 09 — Interação Humano-Computador"
